# Central analysis requires the repository opt-in and protected sonar-main approval.
name: Sonar main readiness

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  readiness:
    if: >-
      vars.SONAR_MAIN_ENABLED == 'true' &&
      github.repository == 'andregoepel/marten-testing' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: andregoepel/workflows/.github/workflows/sonar-library.yml@ebc566218aaa60684d23483c63f974e222d8f7f2
    secrets:
      SONAR_SCAN_TOKEN: ${{ secrets.SONAR_SCAN_TOKEN }}
      SONAR_VERIFY_TOKEN: ${{ secrets.SONAR_VERIFY_TOKEN }}
    with:
      tool-revision: ebc566218aaa60684d23483c63f974e222d8f7f2
